<!--
CLUSS (antes Tortu Live): duelo unico OLIMPIA vs CERRO.
 - Para participar hay que nombrar el club en el chat (olimpia/oli/decano · cerro/cp/ciclon/azulgrana). Sin club no se mueve la carrera.
 - Rotacion de clubes: el ganador sigue y enfrenta al siguiente rival disponible, en orden; no repite al rival inmediatamente anterior. Cada duelo es primero a 3 copas.
 - Botones de comentar, seguir y compartir eliminados (quedan APOYAR y ROSITA). El bot se detiene en el 80% (BOT_CAP).
 - APOYO DEL BOT: si hay mas de 3 usuarios reales de un solo lado, el bot empuja al otro lado, incluso por delante, hasta el 80% (APOYO_TOPE) y se queda ahi; nunca pasa de 80, asi que nunca gana. Ver botApoyo / APOYO_*.
 - Duelo equilibrado y 4 veces mas dificil (doble de puntos que antes), pista 20% mas larga a lo visual (overlay 416x746): todos los clubes comparten el mismo ESFUERZO. Se puede dar ventaja subiendo el valor del club contrario (HANDICAP, junto a DUELO).
 - Podio de copas: 1er club grande y 2do chico, con conteo de copas (P.cp). Las demas reglas de abajo siguen vigentes.
REGLAS DEL PROYECTO. LEER ANTES DE TOCAR EL CODIGO (backend y frontend)
Las reglas marcadas (propuesto) aun no estan confirmadas por el autor.


2. FORMATO DEL TORNEO (especificacion, aun no implementado)
 - Duelos de 2 paises en 2 carriles, con eliminacion directa: el que pierde queda eliminado.
 - Torneo de 3 rondas. Al terminar, reinicio automatico con todos los paises de nuevo en juego. El ultimo en pie se lleva la copa.
 - Nadie queda rey para siempre (propuesto): un pais gana como maximo 2 duelos seguidos y descansa una ronda.
 - Pendiente de definir: Paraguay juega siempre la ronda 1 o entra al sorteo como los demas.

3. VOTACION Y SIGUIENTE RIVAL
 - La gente escribe su pais en el chat. Deteccion flexible: "brasil", "br", "bandera de Brasil", "argentina", "arg", etc. Todo lo demas se ignora.
 - Cada usuario suma como maximo 1 mencion por ronda.
 - Ventana de votacion de 20 a 30 segundos (propuesto).
 - El top 10 de mas comentados se reinicia al terminar cada duelo. El pais que esta peleando no entra al ranking durante su duelo.
 - Siguiente rival (propuesto): sorteo ponderado entre los 3 a 5 primeros del top 10, no siempre el numero 1. El sorteo se muestra en pantalla. Si nadie comenta, se sortea entre los paises disponibles.

4. TABLAS (especificacion, aun no implementado)
 - Top 3 ganadores: banderas grandes, corona al primero y conteo de copas. Desempate: mas duelos ganados. Pendiente: guardar acumulado entre lives (JSON) o arrancar de cero.
 - Top 10 mas comentados: banderas chicas con contador de menciones.

5. INTERFAZ
 - Sin titulo del live (eliminado).
 - Sin indicador de nivel (Nv) en el pie: no corresponde a un overlay.
 - Franja de estadisticas bajo el tablero (unidos, comentarios, regalos, me gusta, seguidores, compartidos) con eventos REALES del live. Los bots (bot:true) y los toques manuales no cuentan. El contador de regalos es solo informativo, nunca para pedir regalos.
 - Tabla de copas en la columna derecha, ordenada por copas, con banderas del 1er al 7mo puesto y corona al primero. El acumulado vive en P.cp (por id de club, se guarda en el servidor: clave cluss.v1).
 - Duelo con solo 2 carriles, mas grandes, y tortugas mas grandes. Los 2 paises activos se definen en DUELO (ids de POOL).
 - Cada pais se muestra con su bandera grande y su nombre debajo, con el mismo ancho que la bandera. Sin luz ni barra de color bajo el encabezado: es un overlay de TikTok, no un juego.

6. REGALO REAL Y ROSITA MANUAL
 - Eventos reales ponderados en el contador: miembro 1, comentario 10, like 1 por me gusta, seguir 3 y compartir 5. Los regalos son independientes del contador.
 - Al completar el limite dinamico se activa el turbo durante 10 s. Los eventos reales no avanzan la pista ni activan el turbo directamente.
 - Cada regalo real avanza 10% inmediatamente y activa además un turbo de 15 s que reparte 6% en total (avance lento); cada unidad de un combo aplica ambas cosas. La victoria espera a que termine el turbo.
 - Al completar el limite dinamico se activa un turbo de 7 s que reparte 3% en total (avance lento, sin salto). APOYAR y ROSITA locales quedan deshabilitados; solo puntuan eventos reales.

7. DIFICULTAD (v12)
 - Ganar cuesta: cada evento vale HARD (0.5) de lo que valia, y el avance pasivo se detiene en PASSIVE_CAP (%). El resto de la pista solo se recorre con interaccion.

8. RITMO AUTOMATICO / BOT ADAPTABLE (v12)
 - Objetivo: sostener TARGET_EPM eventos por minuto. bot = TARGET_EPM - eventos reales/min (nunca menos de 0, maximo BOT_MAX_EPM). Si entran mas usuarios reales el bot baja solo; si no hay nadie, sube. No genera regalos, seguidores ni compartidos.
 - TURBO GRATIS DEL BOT: ELIMINADO (BOT_TURBO_GIFT_ON=false). El turbo se activa al completar el limite dinamico o con un regalo real.
 - El bot GENERA EVENTOS visibles (chat y likes) con nombres tortubot_N: suman puntos, suenan y muestran su burbuja sobre la tortuga. NO cuentan en estadisticas, MVP, XP, avatares, avisos ni logs, y nunca dan el golpe final (BOT_CAP).
9. ESTADISTICAS INTEGRADAS (v14, un solo archivo)
 - PERSISTENCIA (v19): NADA se guarda en el navegador. Todo va al SERVIDOR por la capa SRV (contrato completo para el backend en el bloque 'PERSISTENCIA EN SERVIDOR', justo antes del primer script). El panel de estadisticas sigue en este mismo HTML.
 - Registra chats y regalos REALES (nunca el ritmo automatico) y el inicio/fin de cada ronda. Botones 📊 (torneos) y 🌎 (paises) abren el panel.
 - Solo OBSERVA: no pide ni promete nada a los espectadores (regla 1). Cerrar el panel antes de mostrar pantalla: contiene nombres de usuarios.

10. AJUSTES POR PARTIDA (v15)
 - Al abrir el overlay y al empezar CADA ronda se fuerza: ritmo automatico ON, voz en off ON, efectos de sonido ON, musica de fondo OFF (ver ajustesDePartida). Los botones 🤖 🗣️ 🔊 🎵 siguen sirviendo, pero valen solo hasta la proxima ronda.

11. RESET DE COPAS (v17)
 - Boton ↺ de la barra de herramientas (o "Reiniciar copas" dentro del panel 📊), ambos con doble toque: pone en cero el top 3, las copas y el torneo en curso, y empieza una carrera nueva. El historial guardado de estadisticas NO se borra.

12. NIDO DE HINCHAS (v20)
 - PODIO BAJO LA BANDERA: en vez del nombre del club, los 3 usuarios reales con mas puntos del equipo (1ro con corona, 2do y 3ro con numero); se reinicia cada ronda (renderPod).
 - Abajo de cada carril: SIN huevos grandes (quitados, FRONT_EGGS=0). Solo 12 huevos (2 filas de 6) ARRIBA con los usuarios anteriores.
 - Sin gente real, los huevos son avatares de BOT (🤖 tortubot_N, claramente bots) y el frente sale del JSON de hinchas (HINCHAS_JSON editable + /api/recent-users); sin JSON, la bandera.
 - Los eventos del bot nunca entran al nido ni se hacen pasar por personas. Al empezar cada ronda el nido vuelve a bots.
14. TORNEO LIBRE (v12)
 - Modo 'libre': arranca ACTIVO y BLOQUEADO por defecto (cluss.torneoLock ausente = libre). Solo se sale con el boton 🔒 de la barra (ciclo: Libre > torneos fijos > AUTO > Libre).
 - Duelo suelto de 2 carriles. El chat REAL propone equipos (de cualquier torneo): cada comentario que nombra uno le suma 1 voto (libreVotes, se guarda en el servidor: clave cluss.v1). Los 2 mas votados juegan la siguiente carrera.
 - Todo evento real que no es regalo (comentario, like, seguir, compartir) va SOLO al contador de taps; solo los regalos mueven la pista directo. Un comentario con un equipo que no corre ademas le suma 1 voto.
 - INACTIVIDAD: se mide desde la ultima interaccion REAL (chat, like, regalo, seguir, compartir; los 'member' no reinician el reloj). Plazo 60 s; con mas de 1000 interacciones en el partido, 120 s. Se muestra regresivo en segundos (#idleCountdown). Al vencer, gana el que va primero y avanza, pero NO suma copa.
 - Faltan equipos: con 1 solo del chat se usa ese y se sortea su rival; sin votos se sortean los 2, siempre entre el catalogo de TODOS los torneos. Nunca hay carril vacio ni texto de espera.
13. CONTRATO CON EL BACKEND (v38) - LEER SI TOCAS EL SERVIDOR
 El frontend es UN SOLO HTML. Habla con el backend solo por estas rutas:
  GET  /api/events          Server-Sent Events (SSE) con DOS tipos de mensaje:
       event: status  data: {"connected":true|false,"status":"connecting|reconnecting|failed|..."}   (tambien acepta "isConnected")
       event: update  data: {"entry":{...}}  -> UN evento REAL del live. Campos de entry:
          type            OBLIGATORIO: 'member' | 'chat' | 'gift' | 'like' | 'follow' | 'share' (otro valor se ignora)
          username        id del usuario de TikTok (sin @). Sin username el evento no se asigna a nadie.
          content         texto del comentario (solo chat). El frontend detecta el pais en el texto.
          activityCount   cantidad de likes o de regalos de ese evento (entero >= 1)
          giftName        nombre del regalo (tambien se leen gift_name / gift / giftId)
          profilePictureUrl  foto https del usuario (tambien se leen profilePicture / avatarUrl / avatar / userImage / imageUrl)
          bot             NUNCA lo envia el backend. Solo lo usa el frontend para sus eventos automaticos.
  POST /api/reconnect       inicia/reintenta la conexion con TikTok. 200 = ok, 409 = ya conectado (tambien ok). Otro error: JSON {"message":"..."}.
  GET  /api/recent-users    {"users":[{"username":"...","avatar":"https://..."}]}  SOLO personas reales (alimenta los huevos grandes mientras no hay eventos).
  GET  /manifest.webmanifest y /sw.js   para instalar como app.
 LO QUE EL BACKEND DEBE RESPETAR (reglas 1 y 12; TikTok ya sanciono al autor):
  - Enviar SOLO eventos reales de TikTok. PROHIBIDO inventar, duplicar o simular usuarios, comentarios, likes, regalos, seguidores o compartidos.
  - PROHIBIDO que el backend (o el JSON de usuarios) se haga pasar por personas con nombres inventados. Los bots viven solo en el frontend y se llaman tortubot_N.
  - El backend no decide puntajes ni ganadores: eso lo hace el frontend. Comentarios, likes, seguidores y compartidos solo cargan el contador; los regalos reales avanzan 10% y activan su turbo.
  - /api/recent-users solo debe devolver usuarios que de verdad participaron en el live.
 NOVEDADES v38 (reglas de juego):
  - Bot: un evento suyo vale 1/4 (BOT_W) y, si hay gente real activa, nunca pasa a una tortuga por delante de la otra.
  - Puntos para el contador: comentar = 10 taps, compartir = 5, seguir = 3, like = 1 por me gusta y miembro = 1; al completar 500 taps se avanza 7% y activa turbo.
  - Los eventos sin equipo asignado van al carril seleccionado; los regalos se asignan al equipo mencionado por el usuario en el ultimo minuto.
  - Nido: huevos en blanco al iniciar; los 3 huevos grandes = los 3 usuarios REALES de mayor puntaje; el resto del nido = los demas recientes; huevos de bot (🐢) solo se van cargando con eventos del bot.
  - Alerta de evento = avatar grande del usuario sobre los huevos, que luego baja al nido. Puntaje por usuario: unirse 1, comentar 5, like 1 c/u, seguir 3, compartir 3; cada regalo da +10% y turbo de 15 s con 6% en total repartido.
  - Estadisticas: panel 📊 con pestaña Usuarios (historial completo por usuario, enviado al servidor (flujo user-events); el panel solo muestra una ventana corta).
  - Contador tap tap: miembro 1, comentario 10, like 1 por me gusta, seguir 3 y compartir 5. Al completar 500 taps se avanza 7% y se activa el turbo durante 8 s.
  - Regalo real independiente del contador: +10% inmediato y turbo de 15 s con 6% en total repartido, por cada unidad.
  - CTAs: destello inicial UNA vez por sesion (nada de pedidos en bucle, regla 1.a).
 14. RETOQUES FINALES (v2.1) - capa independiente al final del archivo (confeti, efectos, banners, pips de copas, sonidos propios)
  - Los pedidos de interaccion se escalonan en los hitos 25%, 50% y 75%; la explicacion de la rosita para activar turbo se dice una vez por sesion.
  - Los eventos del bot NO disparan chispas ni emojis de usuario; solo los eventos reales. Los banners (hitos, remontada, carrera pareja, foto finish) son del estado de la pista.
  - Los controles locales APOYAR y ROSITA estan deshabilitados; la rosa solo aparece al llegar un regalo REAL.
  - Respeta prefers-reduced-motion (menos particulas, sin anillos) y el boton 🔊. La musica de fondo sigue la regla 10 (OFF por partida).
15. VOCES (v1.0.7: alerta con avatar del usuario y botones 🗣️ Don Tortu y 🎙️B lector de chat, independientes; sin botones de musica ni de clubes)
  - Don Tortu: voz en off alegre de Google en espanol (pickV/speak). Lector de chat: segunda voz de sexo opuesto, SOLO lee comentarios reales (enqueueChat, CHAT_LEE_TODOS).
  - Cola del lector (chatQueue): espera a que Don Tortu termine (nunca lo pisa), 2,5 s de aire entre comentarios, maximo CHAT_Q_MAX. Se VACIA al iniciar cada partida (voReset).

<!-- ===== PERSISTENCIA EN SERVIDOR (v19) ================================================================
 DECISION DEL AUTOR: NADA se guarda en el navegador (ni localStorage ni sessionStorage ni IndexedDB). El overlay corre en un
 celular de gama media y cada JSON.stringify + escritura sincronica local le quita CPU y memoria al render. Todo lo que debe
 sobrevivir a un reinicio vive en el SERVIDOR; el cliente solo guarda en RAM lo imprescindible para dibujar.

 >>> PARA EL DESARROLLADOR DEL BACKEND: CONTRATO QUE DEBE IMPLEMENTAR <<<
 Mismo origen que /api/events y /api/activity-policy.js. Sin cookies ni login nuevos. Si un endpoint no existe o falla, el juego
 sigue funcionando con los valores por defecto y reintenta con espera creciente (2 s, 4 s ... tope 60 s); en ese caso lo que
 no llego se pierde al cerrar la pagina, y NO se cae a localStorage a proposito.

 1) GET /api/state.js   (Content-Type: application/javascript, sin cache)
    Se carga con una etiqueta script con src, ANTES que el resto, asi el estado inicial esta disponible de forma sincrona (sin XHR bloqueante).
    Debe responder:  window.CLUSS_STATE = { "<clave>": <JSON>, ... };
    Si no hay nada guardado: window.CLUSS_STATE = {};
    Incluir SOLO documentos chicos (ver tabla). NO incluir logs de ronda ni historial por usuario (son pesados y se piden aparte).
 2) PUT    /api/state/:clave     body = JSON del valor (cualquier JSON: objeto, string, numero). Upsert, el ultimo gana.
    DELETE /api/state/:clave     borra el documento (el servidor puede ignorarlo si prefiere conservar historial).
    GET    /api/state/:clave     devuelve el JSON guardado o 404. Solo lo usa el panel de estadisticas al tocar "Ver" / "⬇" en un log de ronda.
    El cliente junta cambios: como mucho 1 PUT por clave cada 1 s (cada 5 s en las claves pesadas) y manda el ultimo valor, no cada cambio.
 3) POST   /api/log/:flujo       body = {"records":[ ... hasta 200 registros ... ]}  Solo AGREGA (append-only). Lote cada ~5 s.
    DELETE /api/log/:flujo       vacia el flujo (solo lo dispara el boton confirmado "Vaciar archivo del chat").
    GET    /api/log/chat-texts.json  y  /api/log/chat-texts.txt   descargas del archivo del chat (ver abajo). Enviar Content-Disposition: attachment.

 TABLA DE CLAVES Y FLUJOS
  clave / flujo            tipo       tamano aprox.   en state.js   contenido
  cluss.v1                 PUT        chico (<20 KB)  SI            progreso del juego: copas por club (cp), victorias, torneo activo, votos del chat, popularidad de paises, etc.
  cluss.torneoLock         PUT        string          SI            "libre" | "auto" | id de torneo fijo elegido con el boton 🔒
  cluss.ctaCalm            PUT        string          SI            "1" | "0" (modo discreto de los CTA: brillo suave; "0" = llamativo con aro y pulso)
  cluss.lang               PUT        chico           SI            idioma del relator por torneo {libre:"es",champions:"en",...}
  cluss.crest.<id>         PUT        string (URL)    SI            cache de la URL del escudo encontrada en Wikipedia
  cluss.stats              PUT        mediano         SI            torneos, rondas, menciones de clubes y indice de logs. Clave pesada: 1 PUT / 5 s
  cluss.libreVotes         PUT        mediano         SI            votos del Torneo Libre: sal, totales, ronda actual, historial (max 500 rondas) y huellas de usuarios unicos. Clave pesada: 1 PUT / 5 s
  cluss.log.<idRonda>      PUT        hasta ~300 KB   NO            log completo de UNA ronda con regalos (regalos + hasta 1500 mensajes). Se escribe y se libera de RAM. El cliente pide DELETE de los logs viejos (quedan los ultimos 15); el servidor puede conservarlos igual.
  cluss.chatArchive        (meta)     chico           SI (opcional) {"v":1,"created":ms,"updated":ms,"trimmed":0,"count":N}. SOLO lo LEE el cliente; lo mantiene el servidor a partir de /api/log/chat-texts. Si falta, el cliente cuenta desde 0.
  log  chat-texts          append     1 registro/comentario  --   [timestamp_ms, "texto"] (sin autor, sin bots). Sin tope en el cliente: el servidor decide la retencion.
  log  user-events         append     1 registro/evento real --   {u:"usuario en minusculas", name:"Usuario", t:ms, type:"chat|like|gift|follow|share|member", n:numero, text?:"...", gift?:"..."}
                                                                   Historial completo por usuario. El cliente solo conserva en RAM una ventana corta (60 usuarios x 60 eventos) para el panel 📊.
 Privacidad: chat-texts no lleva autor; cluss.libreVotes guarda huellas con sal, no nombres. user-events SI lleva el nombre: tratarlo como dato personal (retencion limitada, acceso restringido).
 Concurrencia: hay UN solo overlay escribiendo; el ultimo PUT gana. Si hubiera varios overlays a la vez, el servidor debe fusionar o rechazar.
 =================================================================================================================== -->
<script src="/api/state.js"></script>
<script>
/* SRV: unica puerta de persistencia del cliente. Ver el contrato de arriba. API: get(k,def) · set(k,valor,{keep}) · del(k) · load(k)->Promise · log(flujo,registro) · clearLog(flujo) · flush(urgente) */
(function(){
'use strict';
var BOOT=(window.CLUSS_STATE&&typeof window.CLUSS_STATE==='object')?window.CLUSS_STATE:{};
var mem=Object.assign({},BOOT),DOC='/api/state/',LOG='/api/log/';
var HEAVY=/^cluss\.(stats|libreVotes|log\.)/;       /* claves pesadas: se envian cada 5 s, no cada 1 s */
var docs=new Map(),logs={};
var wait=function(s,k){return s.fails?Math.min(60000,2000*Math.pow(2,s.fails)):(HEAVY.test(k)?5000:1000)};
function send(k,urgent){
 var s=docs.get(k);if(!s||!s.dirty||s.busy)return;
 s.dirty=false;s.busy=true;
 var put=s.op==='put',body;
 if(put){try{body=JSON.stringify(mem[k])}catch(e){s.busy=false;return}}
 fetch(DOC+encodeURIComponent(k),{method:put?'PUT':'DELETE',headers:put?{'Content-Type':'application/json'}:undefined,body:body,keepalive:!!(urgent&&body&&body.length<60000)})
 .then(function(r){if(!r.ok)throw 0;s.fails=0;if(put&&!s.dirty&&s.keep===false)delete mem[k]}) /* keep:false = ya esta en el servidor, se libera la RAM */
 .catch(function(){s.dirty=true;s.fails++})
 .then(function(){s.busy=false;if(s.dirty&&!s.t)s.t=setTimeout(function(){s.t=0;send(k)},wait(s,k))});
}
function sched(k,op,opt){
 var s=docs.get(k);if(!s){s={t:0,busy:false,dirty:false,fails:0,op:'put',keep:true};docs.set(k,s)}
 s.op=op;s.dirty=true;s.keep=!(opt&&opt.keep===false);
 if(!s.t&&!s.busy)s.t=setTimeout(function(){s.t=0;send(k)},wait(s,k));
}
function sendLog(f,urgent){
 var s=logs[f];if(!s||s.busy||!s.q.length)return;
 var batch=s.q.splice(0,200),body=JSON.stringify({records:batch});s.busy=true;
 fetch(LOG+f,{method:'POST',headers:{'Content-Type':'application/json'},body:body,keepalive:!!(urgent&&body.length<60000)})
 .then(function(r){if(!r.ok)throw 0;s.fails=0})
 .catch(function(){s.q=batch.concat(s.q);s.fails++;if(s.q.length>2000)s.q.splice(0,s.q.length-2000)}) /* tope de RAM si el servidor no responde */
 .then(function(){s.busy=false;if(s.q.length&&!s.t)s.t=setTimeout(function(){s.t=0;sendLog(f)},s.fails?Math.min(60000,2000*Math.pow(2,s.fails)):(s.q.length>=200?500:5000))});
}
function flush(urgent){docs.forEach(function(s,k){if(s.t){clearTimeout(s.t);s.t=0}send(k,urgent)});Object.keys(logs).forEach(function(f){var s=logs[f];if(s.t){clearTimeout(s.t);s.t=0}sendLog(f,urgent)})}
window.SRV={
 get:function(k,d){var v=mem[k];return v==null?d:v},
 set:function(k,v,opt){mem[k]=v;sched(k,'put',opt);return true},
 del:function(k){delete mem[k];sched(k,'del');},
 load:function(k){if(mem[k]!=null)return Promise.resolve(mem[k]);return fetch(DOC+encodeURIComponent(k)).then(function(r){return r.ok?r.json():null}).catch(function(){return null})},
 log:function(f,rec){var s=logs[f]||(logs[f]={q:[],t:0,busy:false,fails:0});s.q.push(rec);if(s.q.length>2000)s.q.splice(0,s.q.length-2000);if(!s.t&&!s.busy)s.t=setTimeout(function(){s.t=0;sendLog(f)},5000)},
 clearLog:function(f){var s=logs[f];if(s)s.q.length=0;fetch(LOG+f,{method:'DELETE'}).catch(function(){})},
 flush:flush
};
addEventListener('pagehide',function(){flush(true)});
document.addEventListener('visibilitychange',function(){if(document.hidden)flush(true)});
})();
</script>

<script>
(function(){
/* =====================================================================
   RETOQUES FINALES. Capa independiente: no toca el motor ni el audio de los
   scripts anteriores; solo envuelve push/win/reset/showCombo/handleLiveEntry
   (mismo patron _original + wrapper) y lee el estado global (S, T, over, lead).
   REGLAS 1/5/12: todo es reaccion visual o sonora. No pide ni promete nada,
   no inventa eventos, el bot nunca dispara efectos de usuario real,
   Los controles locales estan deshabilitados; solo los regalos reales muestran una rosa.
   ===================================================================== */
const app=document.getElementById('app'),board=document.querySelector('.board');
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- Posiciones (el overlay se escala con transform: se mide contra #app) ---------- */
function pos(el,fx,fy){
 if(!el)return{x:208,y:320};
 const a=app.getBoundingClientRect(),r=el.getBoundingClientRect(),k=a.width/416||1;
 return{x:(r.left-a.left+r.width*(fx==null?.5:fx))/k,y:(r.top-a.top+r.height*(fy==null?.5:fy))/k};
}
const laneP=(i,fy)=>pos(document.getElementById('sv'+i),.5,fy==null?.55:fy);

/* ---------- Canvas de particulas (solo corre mientras hay particulas) ---------- */
const cv=document.createElement('canvas');cv.id='fxc';cv.setAttribute('aria-hidden','true');
const DPR=Math.min(2,window.devicePixelRatio||1);cv.width=416*DPR;cv.height=746*DPR;app.appendChild(cv);
const cx=cv.getContext('2d');cx.scale(DPR,DPR);
const PS=[];let raf=0,lastT=0;const MAXP=420;
const COLS=['#ffd34d','#e11d48','#3ddc5a','#5ec3f2','#ffffff','#ff8a1f','#a98cff'];
/* Efectos: agrega una particula a la lista y arranca el bucle de animacion si estaba parado. */
function add(p){if(PS.length>=MAXP)PS.shift();PS.push(p);if(!raf){lastT=performance.now();raf=requestAnimationFrame(loop)}}
/* Efectos: crea una particula con valores por defecto (posicion, velocidad, vida, color). */
function P(o){return Object.assign({x:208,y:320,vx:0,vy:0,g:520,drag:.6,life:1.6,age:0,s:7,rot:0,vr:0,col:'#fff',shape:'r',flut:0,fp:rnd(0,6.28),fade:.35,ch:''},o)}
/* Efectos: bucle de animacion (requestAnimationFrame) que mueve y dibuja las particulas. */
function loop(t){
 const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
 cx.clearRect(0,0,416,746);
 for(let i=PS.length-1;i>=0;i--){
  const p=PS[i];p.age+=dt;
  if(p.age>=p.life||p.y>700){PS.splice(i,1);continue}
  const d=Math.max(0,1-p.drag*dt);p.vx*=d;p.vy=p.vy*d+p.g*dt;
  p.x+=p.vx*dt+(p.flut?Math.sin(p.age*6+p.fp)*p.flut*dt:0);p.y+=p.vy*dt;p.rot+=p.vr*dt;
  const left=p.life-p.age,al=left<p.fade?Math.max(0,left/p.fade):1;
  cx.globalAlpha=al;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);
  if(p.shape==='r'){cx.fillStyle=p.col;const f=Math.abs(Math.cos(p.age*7+p.fp));cx.fillRect(-p.s/2,-p.s*.35*f-1,p.s,p.s*.7*f+2)}
  else if(p.shape==='c'){cx.fillStyle=p.col;cx.beginPath();cx.arc(0,0,p.s/2,0,6.283);cx.fill()}
  else if(p.shape==='s'){cx.fillStyle=p.col;cx.beginPath();for(let k=0;k<10;k++){const r=k%2?p.s*.22:p.s*.55,a=k*Math.PI/5-Math.PI/2;cx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}cx.closePath();cx.fill()}
  else if(p.shape==='l'){cx.strokeStyle=p.col;cx.lineWidth=2;cx.lineCap='round';cx.beginPath();cx.moveTo(0,0);cx.lineTo(-p.vx*.04,-p.vy*.04);cx.stroke()}
  else if(p.shape==='e'){cx.font=p.s+'px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.ch,0,0)}
  cx.restore();
 }
 cx.globalAlpha=1;
 if(PS.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,416,746)}
}
const q=n=>RM?Math.ceil(n*.25):n;
/* cañon de confeti: abanico desde (x,y) apuntando a "ang" (grados, 0=derecha, -90=arriba) */
function cannon(x,y,ang,n,spd,spread,cols){
 for(let i=0;i<q(n);i++){const a=(ang+rnd(-spread,spread))*Math.PI/180,v=rnd(spd*.45,spd);
  add(P({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:rnd(380,560),drag:rnd(.7,1.3),life:rnd(1.8,3),s:rnd(6,11),rot:rnd(0,6),vr:rnd(-12,12),col:pick(cols||COLS),shape:pick(['r','r','r','c','s']),flut:rnd(20,60)}))}
}
/* Efectos: lluvia de confeti durante dur segundos. */
function rain(n,cols,dur){
 for(let i=0;i<q(n);i++)setTimeout(()=>add(P({x:rnd(0,416),y:-12,vx:rnd(-25,25),vy:rnd(40,120),g:rnd(70,150),drag:.2,life:rnd(3,5),s:rnd(6,11),rot:rnd(0,6),vr:rnd(-8,8),col:pick(cols||COLS),shape:pick(['r','r','s','c']),flut:rnd(30,70),fade:.5})),rnd(0,dur||1200));
}
/* Efectos: explosion de n particulas desde (x,y). */
function burst(x,y,col,n,spd){
 for(let i=0;i<q(n||18);i++){const a=rnd(0,6.283),v=rnd((spd||160)*.3,spd||160);
  add(P({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:240,drag:1.6,life:rnd(.6,1.1),s:rnd(3,6),col:col||'#ffd34d',shape:pick(['c','s','l']),rot:rnd(0,6),vr:rnd(-8,8)}))}
}
/* Efectos: emojis que salen disparados desde (x,y). */
function emojis(x,y,ch,n,spread){
 for(let i=0;i<q(n);i++)add(P({x:x+rnd(-(spread||10),spread||10),y,vx:rnd(-40,40),vy:rnd(-150,-80),g:-30,drag:.8,life:rnd(1,1.7),s:rnd(14,22),shape:'e',ch,flut:rnd(15,35),fade:.5}));
}
/* Efectos: fuegos artificiales en (x,y). */
function firework(x,y,col){
 const cs=col?[col,'#fff']:COLS;
 for(let i=0;i<q(36);i++){const a=i/36*6.283+rnd(-.1,.1),v=rnd(90,210);
  add(P({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:140,drag:1.9,life:rnd(.9,1.5),s:rnd(3,5),col:pick(cs),shape:'c'}))}
 for(let i=0;i<q(8);i++)add(P({x,y,vx:rnd(-60,60),vy:rnd(-60,60),g:60,drag:1,life:1.1,s:rnd(9,14),col:'#fff',shape:'s',rot:rnd(0,6),vr:rnd(-6,6)}));
}
/* destello, onda expansiva, banner, cuenta regresiva */
function flash(c){const f=document.createElement('div');f.className='fxflash';if(c)f.style.background=c;app.appendChild(f);setTimeout(()=>f.remove(),650)}
/* Efectos: anillo expansivo en (x,y). */
function ring(x,y,c){if(RM)return;const r=document.createElement('div');r.className='fxring';r.style.left=x+'px';r.style.top=y+'px';if(c)r.style.setProperty('--c',c);app.appendChild(r);setTimeout(()=>r.remove(),950)}
const bw=document.createElement('div');bw.id='fxb';bw.setAttribute('role','status');bw.setAttribute('aria-live','polite');
const bs=[document.createElement('span'),document.createElement('span')];bs.forEach(s=>bw.appendChild(s));app.appendChild(bw);let bi=0,bt=0;
/* Efectos: banner grande de hito (mitad de pista, remontada, etc.). */
function banner(txt,col){
 const s=bs[bi^=1];bs.forEach(x=>x.classList.remove('on'));void s.offsetWidth;
 s.textContent=txt;s.style.setProperty('--c',col||'#3f2713');s.classList.add('on');
 clearTimeout(bt);bt=setTimeout(()=>s.classList.remove('on'),1750);
}
const cd=document.createElement('div');cd.id='fxn';cd.setAttribute('aria-hidden','true');cd.innerHTML='<b></b>';app.appendChild(cd);
/* Efectos: numero de la cuenta regresiva (3, 2, 1, YA). */
function num(t,go){const b=cd.firstChild;b.classList.remove('on','go');void b.offsetWidth;b.textContent=t;if(go)b.classList.add('go');b.classList.add('on')}

/* ---------- Sonido propio (WebAudio sintetizado). Respeta el boton 🔊 ---------- */
const FA=(()=>{
 let c,mg,nb;
 const sfxOn=()=>{const b=document.getElementById('bSfx');return !b||b.getAttribute('aria-pressed')!=='false'};
 const run=()=>c&&c.state==='running'&&sfxOn();
 /* Sonidos de los efectos: crea el contexto de audio propio. */
 function init(){
  if(c)return c;
  try{c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return null}
  const lim=c.createDynamicsCompressor();mg=c.createGain();mg.gain.value=.55;mg.connect(lim);lim.connect(c.destination);
  nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  return c;
 }
 /* Sonidos de los efectos: genera una nota sintetizada. */
 function o(f,t,d,ty,v,sl,fl){
  const x=c.createOscillator(),g=c.createGain();x.type=ty||'sine';x.frequency.setValueAtTime(f,t);if(sl)x.frequency.exponentialRampToValueAtTime(sl,t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  let out=g;if(fl){const f1=c.createBiquadFilter();f1.type='lowpass';f1.frequency.setValueAtTime(fl,t);f1.frequency.exponentialRampToValueAtTime(Math.max(200,fl*.3),t+d);x.connect(f1);f1.connect(g)}else x.connect(g);
  g.connect(mg);x.start(t);x.stop(t+d+.05);
 }
 /* ruido filtrado: tipo (bandpass/highpass/lowpass), frecuencia, barrido opcional, ataque */
 function nz(t,d,v,ty,f,f2,atk){
  const s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();s.buffer=nb;s.loop=true;
  fl.type=ty;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=ty==='bandpass'?1.2:.7;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+(atk||.005));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(mg);s.start(t,Math.random());s.stop(t+d+.05);
 }
 const N=m=>440*Math.pow(2,(m-69)/12);
 /* trompeta: sierra con filtro que abre y cierra */
 const brass=(m,t,d,v)=>{o(N(m),t,d,'sawtooth',v,0,2600);o(N(m)*1.005,t,d,'square',v*.4,0,1800)};
 const S={
  pop:t=>{nz(t,.09,.35,'bandpass',2400,900);o(300,t,.08,'sine',.3,90)},
  whoosh:t=>nz(t,.45,.22,'bandpass',500,4200,.18),
  tick:t=>{o(1200,t,.05,'square',.12);nz(t,.03,.1,'highpass',5000)},
  go:t=>{o(660,t,.28,'square',.2,0,3000);o(990,t,.3,'triangle',.22);nz(t,.5,.18,'bandpass',900,5000,.1)},
  mile:t=>{o(N(76),t,.12,'triangle',.28);o(N(83),t+.09,.2,'triangle',.28)},
  lead:t=>{nz(t,.35,.18,'bandpass',600,3500,.12);o(N(72),t+.05,.1,'triangle',.25);o(N(79),t+.13,.18,'triangle',.25)},
  comeback:t=>{o(220,t,.5,'sawtooth',.14,880,2200);[67,71,74,79].forEach((m,i)=>o(N(m),t+.3+i*.07,.3,'triangle',.28))},
  close:t=>{[0,.16,.32].forEach(d=>o(N(60),t+d,.1,'square',.12));o(N(72),t+.5,.3,'square',.16)},
  heart:t=>{[84,88,91,96].forEach((m,i)=>o(N(m),t+i*.05,.28,'sine',.3))},
  turbo:t=>{o(120,t,.6,'sawtooth',.2,700,1500);nz(t,.6,.2,'bandpass',300,3000,.3)},
  /* cohete: ignicion, motor que sube de tono, estela de ruido y chispas al final */
  rocket:t=>{
   nz(t,.12,.4,'highpass',2500,6000);o(70,t,.15,'square',.3,40);
   o(80,t+.08,1.3,'sawtooth',.3,900,1800);o(160,t+.08,1.3,'square',.16,1400,2200);
   nz(t+.05,1.4,.38,'lowpass',400,4200,.15);nz(t+.15,1.2,.22,'bandpass',900,6000,.3);
   [0,.07,.14,.21].forEach((d,i)=>o(N(84+i*4),t+1+d,.3,'sine',.16));
  },
  star:t=>{[96,100,103,108].forEach((m,i)=>o(N(m),t+i*.04,.35,'sine',.16))},
  boom:t=>{o(130,t,.5,'sine',.5,35);nz(t,.35,.28,'lowpass',900,150)},
  crack:t=>{nz(t,.25,.2,'highpass',3000,9000);[0,.04,.09].forEach(d=>o(rnd(1800,3200),t+d,.06,'sine',.08))},
  cheer:(t,v)=>{nz(t,2.2,(v||.22),'bandpass',1400,900,.5);nz(t,2.2,(v||.22)*.7,'bandpass',2600,1800,.7)},
  /* fanfarria de victoria: sol-do-mi-sol con acorde final y aplausos */
  win:t=>{
   [[67,0,.13],[72,.14,.13],[76,.28,.13],[79,.42,.55]].forEach(([m,d,l])=>brass(m,t+d,l,.2));
   [[79,.42],[76,.42],[72,.42],[84,.8]].forEach(([m,d])=>brass(m,t+d,.9,.17));
   o(N(48),t+.42,1.1,'triangle',.4);nz(t+.4,.5,.2,'highpass',5000,9000);
   for(let i=0;i<14;i++)nz(t+1+i*.09+rnd(0,.05),.05,.18,'bandpass',rnd(1200,3500));
   S.cheer(t+.5,.2);
  },
  /* campeon del torneo: fanfarria larga, cascada brillante y fuegos artificiales */
  champ:t=>{
   const m=[[60,0],[64,.12],[67,.24],[72,.36],[76,.5],[79,.64],[84,.8]];
   m.forEach(([n,d],i)=>brass(n,t+d,i===6?1.3:.16,.2));
   [[72,.8],[76,.8],[79,.8],[88,1.35]].forEach(([n,d])=>brass(n,t+d,1.3,.15));
   o(N(36),t+.8,1.6,'triangle',.45);S.cheer(t+.6,.26);
   for(let i=0;i<10;i++)o(N(84+[0,4,7,12][i%4]+(i>3?12:0)),t+1.5+i*.08,.45,'sine',.14);
   [1.2,1.9,2.6,3.3].forEach(d=>{S.boom(t+d);S.crack(t+d+.15)});
  }
 };
 return{init,unlock(){const x=init();if(x&&x.state==='suspended')x.resume().catch(()=>{})},
  p(n,delay){if(!c||!sfxOn())return;const go=()=>{try{S[n](c.currentTime+(delay||0.001))}catch(e){}};
   if(c.state==='running')go();else c.resume().then(go).catch(()=>{})},
  vis(v){if(c)(v?c.resume():c.suspend()).catch(()=>{})}};
})();

/* ---------- Pips de copas del torneo (3 por carril), leidos del guardado ---------- */
function wins(){try{return SRV.get('cluss.v1',{}).wins||[]}catch(e){return[]}}
const pips=[],pipN=[];
T.forEach((t,i)=>{const l=document.getElementById('ln'+i);if(!l)return;const e=document.createElement('span');e.className='fxp';e.setAttribute('aria-hidden','true');e.innerHTML='<i></i><i></i><i></i>';l.appendChild(e);pips[i]=e;pipN[i]=0});
/* Copas: sincroniza los puntos (pips) de copas bajo cada bandera. */
function pipsSync(animate){
 const w=wins();T.forEach((t,i)=>{if(!pips[i])return;const n=Math.min(3,w[i]||0),els=pips[i].children;
  for(let k=0;k<3;k++){const f=k<n;els[k].classList.toggle('f',f);els[k].classList.remove('n');if(animate&&f&&k===n-1&&n>pipN[i]){void els[k].offsetWidth;els[k].classList.add('n')}}
  pipN[i]=n})}
pipsSync(false);

/* ---------- Estado de la ronda para los banners ---------- */
const mil=new Set();let maxDef=T.map(()=>0),closeShown=false,fxBot=false,lastSpark=0,lastM=1,prevLead=-1;
/* Reinicia los hitos y datos de seguimiento al empezar una ronda. */
function roundReset(){mil.clear();maxDef=T.map(()=>0);closeShown=false;prevLead=-1}

/* ---------- ENGANCHES ---------- */
const _hle=handleLiveEntry;
handleLiveEntry=function(e){fxBot=!!(e&&e.bot);try{_hle(e)}finally{fxBot=false}};

const _push=push;
push=function(i,type,n,m){
 const was=over,l0=lead;
 _push.apply(this,arguments);
 if(was||over||i<0||!S[i])return; /* si esta jugada gano, win() ya hizo sus efectos */
 const lp=S.map(s=>s.p),mx=Math.max(...lp);
 /* chispas: toques manuales y eventos REALES (nunca del bot) */
 const now=performance.now();
 if(!fxBot&&now-lastSpark>110){
  lastSpark=now;const c=T[i].c,p=laneP(i,Math.max(.12,.84-S[i].p/100*.72));
  if(type==='like')emojis(p.x,p.y,'❤️',2,12);
  else if(type==='gift'){emojis(p.x,p.y,'🌹',6,16);burst(p.x,p.y,'#ff4d6d',14,150)} /* reaccion a regalo real */
  else if(type==='share'){burst(p.x,p.y,'#5ee08a',14,150);emojis(p.x,p.y,'↗️',2,10)}
  else if(type==='follow'){burst(p.x,p.y,'#5ec3f2',14,150);emojis(p.x,p.y,'⭐',3,12)}
  else if(type==='chat'){burst(p.x,p.y,c,8,110)}
 }
 /* remontada y cambio de lider */
 S.forEach((s,j)=>{const d=Math.max(...lp.filter((_,k)=>k!==j))-s.p;if(d>maxDef[j])maxDef[j]=d});
 if(lead!==l0&&lead>=0&&l0>=0){
  if(maxDef[lead]>=18&&mx>=30){banner('🚀 '+T[lead].n,T[lead].c);FA.p('comeback');const p=laneP(lead,.4);burst(p.x,p.y,T[lead].c,30,220);ring(p.x,p.y,T[lead].c);maxDef[lead]=0}
  else if(mx>=15){FA.p('lead');const p=laneP(lead,.4);ring(p.x,p.y,T[lead].c)}
 }
 /* hitos de la pista */
 [[25,'🏁 25%'],[50,'🏁 50%'],[75,'🏁 75%']].forEach(([v,t])=>{if(mx>=v&&!mil.has(v)){mil.add(v);banner(t,T[lead>=0?lead:i].c);FA.p('mile');const p=laneP(i,.3);burst(p.x,p.y,T[i].c,20,170);if(v===75)hype('💵🔫','','➜ 🏆',T[lead>=0?lead:i].c)}});
 /* carrera pareja en la parte alta */
 if(!closeShown&&mx>=60&&mx<95){const s=[...lp].sort((a,b)=>b-a);if(s.length>1&&s[0]-s[1]<=4){closeShown=true;banner('⚖️🔥','#e11d48');FA.p('close')}}
};

const _win=win;
win=function(i){
 const first=!over,ps=S.map(s=>s.p);_win(i);
 if(!first)return;
 clearTimeout(bt);bs.forEach(x=>x.classList.remove('on')); /* el banner de hito no tapa la pantalla de ganador */
 const rest=Math.max(...ps.filter((_,j)=>j!==i)),photo=Math.min(100,ps[i])-rest<=3;
 const c=T[i].c,p=laneP(i,.35);
 pipsSync(true);
 const h=document.querySelector('#win h2'),champ=!!(h&&/CAMPE/i.test(h.textContent));
 flash(champ?'#ffe9a8':'#fff');ring(p.x,p.y,c);setTimeout(()=>ring(p.x,p.y,'#fff'),180);
 burst(p.x,p.y,c,40,260);
 cannon(0,746,-62,champ?60:36,820,16);cannon(416,746,-118,champ?60:36,820,16);rain(champ?80:46,null,1500);
 if(photo&&!champ){setTimeout(()=>banner('📸🏁','#e11d48'),400)}
 if(champ){
  FA.p('champ');
  [[.5,.3],[.2,.42],[.8,.38],[.35,.2],[.7,.24],[.5,.5]].forEach(([fx,fy],k)=>setTimeout(()=>{firework(fx*416,fy*746,k%2?c:null)},700+k*620));
  setTimeout(()=>rain(60,['#ffd34d','#fff','#ff8a1f'],2500),1800);
 }else{
  FA.p('win');[.35,.9,1.4].forEach(d=>setTimeout(()=>{cannon(rnd(60,356),rnd(300,420),-90,12,420,40)},d*1000));
 }
 FA.p('star',.9);
};

const _reset=reset;
reset=function(){
 const had=!!document.querySelector('#win.show');
 _reset.apply(this,arguments);
 roundReset();lastM=1;PS.length=0;

<script>
(function(){
/* ---------- 1) ESCUDOS Y BANDERAS ---------- */
const WIKI={ol:'Club_Olimpia',cp:'Cerro_Porteño',li:'Club_Libertad',gu:'Club_Guaraní',lu:'Sportivo_Luqueño',na:'Club_Nacional_(Paraguay)',sa:'Club_Sol_de_América',to:'12_de_Octubre_Football_Club'};
const cssUrl=k=>{try{const v=getComputedStyle(document.documentElement).getPropertyValue('--crest-'+k);const m=v.match(/url\(\s*["']?([^"')]+)["']?\s*\)/);return m?m[1]:''}catch(e){return''}};
/* BACKEND: cache de escudos en la clave cluss.crest.<id> (string con la URL) */
const lsGet=k=>{try{return SRV.get('cluss.crest.'+k,'')||''}catch(e){return''}},lsSet=(k,v)=>{try{SRV.set('cluss.crest.'+k,v)}catch(e){}};
const list=k=>{if(/^ct-/.test(k)){const c=k.slice(3),m={en:'gb-eng',wl:'gb-wls',sc:'gb-sct',ni:'gb-nir'};return['https://flagcdn.com/w160/'+(m[c]||c)+'.png']}
 const a=['flags/'+k+'.png','flags/'+k+'.svg'],u=cssUrl(k),w=lsGet(k);if(u)a.push(u);if(w)a.push(w);return a};
const wp={};
const wiki=k=>wp[k]||(wp[k]=WIKI[k]?fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(WIKI[k])).then(r=>r.ok?r.json():null).then(j=>{const u=j&&(j.thumbnail&&j.thumbnail.source||j.originalimage&&j.originalimage.source)||'';if(u)lsSet(k,u);return u}).catch(()=>''):Promise.resolve(''));
window.crestOk=img=>{if(!/^ct-/.test(img.dataset.k))return;const cb=img.parentNode&&img.parentNode.querySelector('.cb');if(cb)cb.style.display='none'}; /* paises: la imagen reemplaza al dibujo; clubes: el escudo va encima de la bandera */
window.crestErr=async img=>{const k=img.dataset.k,L=list(k),i=+img.dataset.i+1;
 if(i<L.length){img.dataset.i=i;img.setAttribute('href',L[i]);return}
 if(i===L.length){img.dataset.i=i;const u=await wiki(k);if(u&&!L.includes(u)){img.setAttribute('href',u);return}}
 img.remove()}; /* sin imagen: queda la bandera dibujada */
/* FLAG_FIT: 'none' = la bandera se estira y llena todo el cuadro; 'xMidYMid meet' = se ve entera sin deformar (define window.FLAG_FIT antes) */
const _flag=flag;
/* BANDERAS DE CLUB dibujadas (sin internet): franjas con los colores de cada club. Edita colores/orientacion aqui */
const CF={ol:{c:['#ffffff','#111111','#ffffff'],h:1,w:[33,34,33]},cp:{c:['#0b3d91','#9b1030'],n:5},li:{c:['#ffffff','#111111'],n:5},gu:{c:['#f5c400','#111111'],n:5},lu:{c:['#1d4ed8','#f5c400'],n:5},na:{c:['#ffffff','#c8102e','#1d4ed8'],h:1,w:[58,21,21]},sa:{c:['#1d4ed8'],n:1},to:{c:['#1d4ed8','#ffffff'],n:5}}; /* COLORES DE CAMISETA (fuente: RSSSF, Paraguay Team Colors): Olimpia blanca con franja negra · Cerro azul y grana · Libertad blanco y negro · Guarani amarillo y negro · Luqueño azul y amarillo · Nacional blanca con vivos rojo y azul · Sol de America azul · 12 de Octubre (Itaugua) azul y blanco */
function clubFlag(k,x,y,w,h){const d=CF[k];if(!d)return null;let o='';
 if(d.h){let yy=y;d.c.forEach((c,i)=>{const hh=h*d.w[i]/100;o+=`<rect x="${x}" y="${yy}" width="${w}" height="${hh+.4}" fill="${c}"/>`;yy+=hh})}
 else{for(let j=0;j<d.n;j++)o+=`<rect x="${x+w*j/d.n}" y="${y}" width="${w/d.n+.4}" height="${h}" fill="${d.c[j%d.c.length]}"/>`}
 return o+`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="${Math.max(.3,w/60)}"/>`}
flag=function(k,x,y,w,h){const pais=/^ct-/.test(k),own=!pais&&clubFlag(k,x,y,w,h),b=own||_flag.apply(this,arguments),L=list(k);if(!L.length)return b;
 const bx=pais?x:x+w*.18,by=pais?y:y+h*.1,bw=pais?w:w*.64,bh=pais?h:h*.8,fit=pais?(window.FLAG_FIT||'none'):'xMidYMid meet';
 return `<g class="crest" data-k="${k}"><g class="cb">${b}</g><image data-k="${k}" data-i="0" x="${bx}" y="${by}" width="${bw}" height="${bh}" preserveAspectRatio="${fit}" href="${L[0]}" onload="crestOk(this)" onerror="crestErr(this)"/></g>`};
try{T.forEach((t,i)=>{const l=$('#ln'+i);if(!l)return;const f=l.querySelector('.fgb');if(f)f.innerHTML=flag(t.id,0,0,20,14);l.querySelectorAll('.shf').forEach(g=>g.innerHTML=flag(t.id,32,469.5,36,39))});if(typeof renderTop3==='function')renderTop3()}catch(e){}
/* ---------- 2) UX: lectores de pantalla ---------- */
['#bub','#toast'].forEach(s=>{const n=$(s);if(n)n.setAttribute('aria-live','polite')});
/* ---------- 3) GAMIFICACION ---------- */
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,MIL=[25,50,75],lastP=[0,0],mil=[0,0],lastB=[0,0];
function burst(i,n,em){const sv=$('#sv'+i);if(!sv||RM||document.hidden)return;
 for(let k=0;k<n;k++){const s=document.createElement('i');s.className='gx';s.textContent=em[Math.floor(Math.random()*em.length)];
  s.style.left=(38+Math.random()*24)+'%';s.style.top=(S[i]?((544-Math.min(100,S[i].p)*4.7)/588*100):50)+'%';
  s.style.setProperty('--dx',((Math.random()-.5)*90)+'px');s.style.setProperty('--dy',(-30-Math.random()*70)+'px');
  sv.appendChild(s);setTimeout(()=>s.remove(),950)}}
const _upd=update;
update=function(){const r=_upd.apply(this,arguments);
 try{S.forEach((s,i)=>{const p=s.p,d=p-lastP[i];lastP[i]=p;
  if(p<mil[i])mil[i]=0; /* carrera nueva */
  if(d>=1&&Date.now()-lastB[i]>200){lastB[i]=Date.now();burst(i,d>=5?6:2,['✨','⭐','💥'])}
  MIL.forEach(th=>{if(mil[i]<th&&p>=th&&p<100){mil[i]=th;const l=$('#ln'+i);if(l){l.classList.remove('mil');void l.offsetWidth;l.classList.add('mil');setTimeout(()=>l.classList.remove('mil'),850)}
   burst(i,8,['🔥','⭐']);try{toast(T[i].n+' '+th+'%','🔥');A.sfx('ach')}catch(e){}}})})}catch(e){}
 return r};
const _win=win;
win=function(i){const r=_win.apply(this,arguments);
 try{const a=$('#app');a.classList.remove('wflash');void a.offsetWidth;a.classList.add('wflash');setTimeout(()=>a.classList.remove('wflash'),900);burst(i,22,['🏆','⭐','🎉','✨'])}catch(e){}
 return r};
const _h=handleLiveEntry;
handleLiveEntry=function(e){const r=_h.apply(this,arguments);
 try{if(e&&!e.bot&&e.type==='chat'){const i=findTeam(String(e.content||''));if(i>=0)burst(i,3,['💬','⭐'])}}catch(x){}
 return r};
})();
</script>

<script>
(function(){
const M=TOURNAMENT_MODES.slice(),L=TOURNAMENT_LABELS,SHORT={libre:'LIBRE',libertadores:'LIBERTADORES',champions:'CHAMPIONS',countries:'MUNDIAL',america:'AMÉRICA',elite:'ELITE'};
let lock='libre';try{const v=SRV.get('cluss.torneoLock',null);if(v==='auto')lock=null;else if(M.includes(v))lock=v}catch(e){} /* por defecto: TORNEO LIBRE bloqueado */
const foot=document.querySelector('#topbar .foot')||document.querySelector('.foot');if(!foot)return;
const b=document.createElement('button');b.id='bTorneoSel';b.type='button';
const fila=document.createElement('div');fila.id='filaVT';const ver=document.querySelector('.version');
fila.appendChild(b);if(ver)fila.appendChild(ver);foot.appendChild(fila); /* torneo + version/limite de taps en la misma fila */
function pinta(){b.textContent=lock?'🔒 '+SHORT[lock]:'🔄 TORNEO: AUTO';b.classList.toggle('lock',!!lock);
 const d=lock?'Torneo fijo: '+L[lock]:'Torneo automático (rota solo al terminar cada copa)';b.title=d+' · tocar para cambiar';b.setAttribute('aria-label',d+'. Tocar para cambiar')}
function guarda(){try{SRV.set('cluss.torneoLock',lock||'auto')}catch(e){}} /* BACKEND: PUT /api/state/cluss.torneoLock */
/* fijo = la lista de torneos queda con uno solo, asi la rotacion del juego siempre vuelve a el; AUTO = lista completa */
function lista(){TOURNAMENT_MODES.splice(0,TOURNAMENT_MODES.length,...(lock?[lock]:M))}
b.onclick=()=>{const seq=[...M,null];lock=seq[(seq.indexOf(lock)+1)%seq.length];guarda();pinta();
 TOURNAMENT_MODES.splice(0,TOURNAMENT_MODES.length,...M); /* lista completa para poder arrancar el torneo */
 const CT=window.clussTorneo;try{if(lock&&CT&&lock!==CT.modo())CT.start(lock);else if(CT)CT.toast(lock?'Torneo fijo: '+L[lock]:'Torneo automático','🏆')}catch(e){}
 lista()};
pinta();
if(lock&&window.clussTorneo&&lock!==window.clussTorneo.modo()){TOURNAMENT_MODES.splice(0,TOURNAMENT_MODES.length,...M);setTimeout(()=>{try{window.clussTorneo.start(lock)}catch(e){}lista()},800)}else lista();
})();
</script>
<!-- ===== TORNEO LIBRE: votos del chat REAL (sin bots). Cada comentario que nombra un equipo que NO corre le suma 1 voto para la proxima carrera (1 comentario con voto cada 8 s por usuario). No toca el contador ni la pista: todo evento que no es regalo sigue yendo solo al contador de taps. Para quitar: borrar este bloque. ===== -->
<script>
(function(){
const _h=handleLiveEntry,ultimo=new Map();
handleLiveEntry=function(e){
 try{
  if(e&&!e.bot&&e.type==='chat'&&tournamentMode==='libre'){
   const u=String(e.username||'').trim().toLowerCase(),now=Date.now();
   if(u&&now-(ultimo.get(u)||0)>=8000){const antes=Object.assign({},libreVotes);if(libreVote(e.content)){ultimo.set(u,now);try{const ids=Object.keys(libreVotes).filter(id=>(libreVotes[id]||0)>(antes[id]||0));if(window.libreArchive)window.libreArchive.vote(u,ids)}catch(_){}if(typeof saveTournamentProgress==='function')saveTournamentProgress()}}
  }
 }catch(x){console.error(x)}
 return _h.apply(this,arguments);
};
})();
</script>

<script>

 de:()=>H3('#000','#dd0000','#ffce00'),

 uy:()=>{let o=R(0,0,30,20,'#fff');for(let i=1;i<9;i+=2)o+=R(0,i*20/9,30,20/9,'#0038a8');return o+R(0,0,13.4,8.9,'#fff')+C(6.7,4.4,2.3,'#fcd116')+C(6.7,4.4,1.3,'#e8a800')},

<script>
(function(){

const GIFTS=[
 {k:'rosa',ic:'🌹',n:'ROSITA',a:'#ff5a7a',b:'#b80f3a'},
 {k:'dona',ic:'🍩',n:'DONA',a:'#ffa65a',b:'#b8500f'},
 {k:'confeti',ic:'🎉',n:'CONFETI',a:'#5aa8ff',b:'#1c4fb8'}];
const KEYS=GIFTS.map(g=>g.k),LSK='cluss.cta';
let st={top:false,A:[],B:[]}; /* CTA SIEMPRE ARRANCA APAGADO: no se lee lo guardado; se activa a mano desde el boton CTA */
try{const v=null;if(v&&typeof v==='object'){
 if(typeof v.top==='boolean')st.top=v.top;
 ['A','B'].forEach(t=>{if(Array.isArray(v[t]))st[t]=v[t].filter(k=>KEYS.includes(k))})}}catch(e){}
const guardar=()=>{}; /* NO se persiste: los CTA siempre arrancan apagados (nunca se leia lo guardado), asi que no se manda nada al servidor */
/* MODO DISCRETO de los CTA de equipos: por defecto ACTIVADO (se guarda en cluss.ctaCalm). Activado = no brillan ni pulsan, solo se mueven suave. */
let calm=true;try{if(SRV.get('cluss.ctaCalm','1')==='0')calm=false}catch(e){}
const guardaCalm=()=>{try{SRV.set('cluss.ctaCalm',calm?'1':'0')}catch(e){}}; /* BACKEND: PUT /api/state/cluss.ctaCalm */
const refit=()=>setTimeout(()=>window.dispatchEvent(new Event('resize')),60);
const nm=i=>{try{return String(T[i].n||'').toUpperCase()}catch(e){return i?'EQUIPO B':'EQUIPO A'}};

const pan=document.createElement('section');pan.id='panCta';pan.hidden=true;pan.setAttribute('role','dialog');pan.setAttribute('aria-label','Pagina de CTA');

pan.innerHTML='<div class="top"><h2>🎁 CTA</h2><button type="button" class="x" id="ctaX">✕ Cerrar</button></div>'
 +'<div class="sec"><h3>CTA principal <small>· franja de arriba (Rosa / Pistola / Otros)</small></h3><button type="button" class="sw" id="ctaTop"></button></div>'
 +'<div class="sec"><h3>CTA de los equipos <small>· regalo ➜ bandera del equipo</small></h3><button type="button" class="sw" id="ctaCalm"></button><p>Modo discreto: los CTA de cada equipo son más grandes y llaman un poco la atención (brillo dorado suave y latido lento, sin aro ni pulso fuerte) (sin texto: regalo, flecha y bandera del equipo al que apoya). El CTA principal se maneja aparte, arriba.</p></div>'
 +'<div class="sec"><h3>Equipo A <small id="ctaNA"></small></h3>'+grid('A')+'<p>Tocá un regalo para mostrarlo u ocultarlo debajo del nombre del equipo.</p></div>'
 +'<div class="sec"><h3>Equipo B <small id="ctaNB"></small></h3>'+grid('B')+'</div>';

 {const cw=pan.querySelector('#ctaCalm');cw.textContent=calm?'🔒 DISCRETO · brillo suave':'🔓 LLAMATIVO · brilla y pulsa';cw.classList.toggle('off',!calm);cw.setAttribute('aria-pressed',String(calm))}

 pan.querySelector('#ctaNA').textContent='· '+nm(0);pan.querySelector('#ctaNB').textContent='· '+nm(1);

 if(cambio)refit()}

 +LABELS.map(([k,n])=>'<div class="rw'+(k===cur?' cur':'')+'" data-k="'+k+'"><span class="nm">'+n+(k===cur?' ●':'')+'</span><div class="sg" data-start>'+seg('es',pref[k]==='es')+seg('en',pref[k]==='en')+'</div><button type="button" class="go" data-go>Ir ▶</button></div>').join('')
 +'<p>Ir ▶ = pasar a ese torneo / go to that tournament</p></div>'}
const abrir=()=>{draw();pan.hidden=false},cerrar=()=>{pan.hidden=true};
pan.addEventListener('click',e=>{const t=e.target;
 if(t.closest('#lgX')){cerrar();return}
 const g=t.closest('.lg');
 if(g){const l=g.dataset.l,row=g.closest('.rw');
  if(row){const k=row.dataset.k;pref[k]=l;savePref();if(k===mode())set(l==='en')}else set(l==='en');
  draw();return}
 const go=t.closest('[data-go]');
 if(go){const k=go.closest('.rw').dataset.k;
  try{window.clussTorneo.start(k)}catch(x){}
  last=k;set(DEF(k));cerrar()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!pan.hidden)cerrar()});
if(btn)btn.addEventListener('click',abrir);
function mode(){try{return SRV.get('cluss.v1',{}).tournamentMode||'libre'}catch(e){return 'libre'}}
function poll(){const m=mode();if(m!==last){last=m;set(DEF(m))}}
poll();setInterval(poll,500);paint();
})();

<script>
(function(){
/* ---------- 2) CUADRO DE USUARIOS: top 10 con su puntaje (1.2K, 3.4M) ---------- */
const PER_TEAM=12,COLS=4; /* 12 hinchas por equipo; COLS=4 -> 3 filas de avatares grandes (6 -> 2 filas mas bajas y avatares mas chicos) */
const fmt=n=>{n=Math.floor(n||0);if(n<1000)return String(n); /* 999 -> 1k -> 12k -> 1.2m */
 const f=v=>v<10?v.toFixed(1).replace(/\.0$/,''):String(Math.round(v));
 return n>=999500?f(n/1e6)+'m':f(n/1e3)+'k'};
const info=new Map(); /* foto y nombre del ultimo evento real de cada usuario */
const _h=handleLiveEntry;
handleLiveEntry=function(e){
 try{if(e&&!e.bot&&e.username){const k=String(e.username).trim().toLowerCase();
  const url=String(e.profilePictureUrl||e.profilePicture||e.avatarUrl||e.avatar||e.userImage||e.imageUrl||'');
  const o=info.get(k)||{name:String(e.username).trim(),url:''};if(url)o.url=url;info.set(k,o)}}catch(x){}
 return _h.apply(this,arguments);
};
const box=document.createElement('div');box.id='rank';box.setAttribute('aria-label','Hinchas de cada equipo');
box.style.setProperty('--rc',COLS);
const bar=document.getElementById('topbar'),app=document.getElementById('app');
(bar||app).prepend(box);
let last=null; /* null: dibuja los 12 huecos de cada equipo aunque aun no haya usuarios */
const teamOfUser=(k,known)=>{const kn=known&&known.get(k);if(kn&&kn.t>=0)return kn.t;try{if(picks.has(k))return picks.get(k)}catch(e){}return -1};
function paint(){try{
 const userScore=window.__userScore,known=window.__known;if(!userScore)return;
 const all=[...userScore.entries()].filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
 const per=[0,1].map(t=>all.filter(x=>teamOfUser(x[0],known)===t).slice(0,PER_TEAM));
 const key=per.map((arr,t)=>(T[t]?T[t].id+T[t].c:'')+'>'+arr.map(x=>x.join(':')+':'+((info.get(x[0])||{}).url||'')).join('|')).join('||');
 if(key===last)return;last=key;
 box.textContent='';
 per.forEach((arr,t)=>{
  const rk=document.createElement('div');rk.className='rk';rk.dataset.t=t;
  const tc=T[t]&&T[t].c;rk.style.setProperty('--tc',tc==='#f1f1f1'?'#e5e5e5':(tc||'#3f2713'));
  if(T[t])rk.setAttribute('aria-label','Hinchas de '+T[t].n);
  for(let i=0;i<PER_TEAM;i++){
   const d=document.createElement('div'),x=arr[i];d.className='u'+(i?'':' f1')+(x?'':' e');
   const av=document.createElement('div');av.className='av';
   const n=document.createElement('span');n.className='n';n.textContent=i+1;
   const s=document.createElement('span');s.className='s';
   if(x){
    const k=x[0],o=info.get(k)||(known&&known.get(k)?{name:known.get(k).name,url:known.get(k).url}:{name:k,url:''});
    const kn=known&&known.get(k);if(T[t])av.style.setProperty('--c',T[t].c==='#f1f1f1'?'#e5e5e5':T[t].c);
    const ini=()=>{av.textContent=(o.name||k).replace(/^@/,'').charAt(0).toUpperCase()};
    const url=o.url||(kn&&kn.url)||'';
    if(/^https:/.test(url)){const im=new Image();im.referrerPolicy='no-referrer';im.alt='';im.onerror=()=>{im.remove();ini()};im.src=url;av.append(im)}else ini();
    d.title='@'+(o.name||k)+' · '+x[1]+' pts';s.textContent=fmt(x[1]);
   }
   d.append(n,av,s);rk.append(d);
  }
  box.append(rk);
 });
 sizeUp();
}catch(e){}}
let lastH=0;
function sizeUp(){const h=box.offsetHeight;if(!h||h===lastH)return;lastH=h;
 document.documentElement.style.setProperty('--pnl',(h+4)+'px');dispatchEvent(new Event('resize'))}
paint();setInterval(paint,700);
addEventListener('load',()=>setTimeout(()=>{lastH=0;sizeUp()},700));
})();
</script>
<!-- ===== ARCHIVOS (v1): VOTOS DEL TORNEO LIBRE + TEXTOS DEL CHAT, votos como documento en el SERVIDOR (cluss.libreVotes) y textos del chat como flujo append-only (chat-texts) =====
 · cluss.libreVotes  = votos por equipo, de la ronda actual, historial de rondas y usuarios UNICOS. Los usuarios se guardan solo como huella con sal (no reversible a nombre); el JSON que se descarga ni siquiera incluye las huellas, solo los conteos.
 · cluss.chatArchive = TODOS los textos reales del chat (sin bots), SIN autor. Solo [fecha, texto].
 · Boton 🗂️ de la barra: panel con conteos (sin mostrar textos ni nombres), descarga de votos (JSON), chat (JSON o TXT) y, aparte, "Vaciar archivo del chat" con confirmacion. Descargar NUNCA borra.
 La retencion de textos y logs la decide el servidor (ya no hay limite de espacio del navegador); solo se recortan las rondas de votos mas viejas (tope MAX_ROUNDS). Para quitar: borrar este bloque (y el bloque de libreArchive en TORNEO LIBRE es inofensivo). ===== -->
<style id="archivo-css">
#arch{position:absolute;inset:0;z-index:40;background:#1b120a;color:#f3ece1;padding:10px;display:flex;flex-direction:column;gap:8px;font:12px/1.4 Inter,sans-serif;overflow:auto}
#arch[hidden]{display:none}
#arch header{display:flex;justify-content:space-between;align-items:center;font-size:14px}
#arch section{background:#2c1b0d;border:1px solid #6f4a28;border-radius:10px;padding:8px}
#arch h3{margin:0 0 4px;font:900 12px Inter,sans-serif;color:#ffe14d}
#arch button{font:700 11px Inter,sans-serif;color:#f3ece1;background:#3f2713;border:1px solid #6e4524;border-radius:999px;padding:5px 10px;cursor:pointer;margin:3px 3px 0 0}
#arch button.warn{background:#7a1f1f;border-color:#e11d48}
#arch .mut{color:#a39a8b;font-size:11px}
#arch ul{margin:4px 0 0;padding-left:16px}
#arch .ok{color:#7dffa0}
</style>
<script>
(function(){
'use strict';
const K_V='cluss.libreVotes',K_C='cluss.chatArchive',MAX_ROUNDS=500,MAX_TXT=500;
const ld=k=>SRV.get(k,null);   /* BACKEND: cluss.libreVotes viene en /api/state.js */
const sv=(k,v)=>SRV.set(k,v);  /* BACKEND: PUT /api/state/cluss.libreVotes (pesado, 1 PUT / 5 s) */
const iso=t=>new Date(t).toISOString(),stamp=()=>iso(Date.now()).replace(/[:.]/g,'-').toLowerCase();
const persist=(key,obj,trim)=>{for(let i=0;i<40;i++){if(sv(key,obj))return true;if(!trim())break}return false};

/* ---------- VOTOS DEL TORNEO LIBRE ---------- */
let VS=ld(K_V);
if(!VS||typeof VS!=='object'||VS.v!==1)VS={v:1,salt:Math.random().toString(36).slice(2)+Date.now().toString(36),created:Date.now(),updated:Date.now(),total:{},round:{},all:[],rounds:[]};
['total','round'].forEach(k=>{if(!VS[k]||typeof VS[k]!=='object')VS[k]={}});if(!Array.isArray(VS.all))VS.all=[];if(!Array.isArray(VS.rounds))VS.rounds=[];
/* huella con sal de 53 bits (cyrb53): cuenta personas distintas sin guardar el nombre */
const H=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
const uid=u=>H(VS.salt+'|'+String(u).trim().toLowerCase());
let vT=0;
const saveV=now=>{if(now){clearTimeout(vT);vT=0;persist(K_V,VS,()=>VS.rounds.length?(VS.rounds.splice(0,Math.ceil(VS.rounds.length*.2)),true):false);return}
 if(!vT)vT=setTimeout(()=>{vT=0;saveV(true)},500)};
function vote(user,ids){
 if(!user||!ids||!ids.length)return;
 const h=uid(user);
 ids.forEach(id=>{[VS.total,VS.round].forEach(m=>{const r=m[id]||(m[id]={votes:0,u:[]});r.votes++;if(!r.u.includes(h))r.u.push(h)})});
 if(!VS.all.includes(h))VS.all.push(h);
 VS.updated=Date.now();saveV();
}
function commitRound(duel){ /* la ronda de votos termina cuando se sortea el duelo siguiente */
 const ids=Object.keys(VS.round);
 if(ids.length){
  const un=new Set(),votes={};
  ids.forEach(id=>{const r=VS.round[id];r.u.forEach(x=>un.add(x));votes[id]={votes:r.votes,uniqueUsers:r.u.length}});
  VS.rounds.push({t:Date.now(),duel:(duel||[]).slice(),votes,uniqueUsers:un.size});
  while(VS.rounds.length>MAX_ROUNDS)VS.rounds.shift();
 }
 VS.round={};VS.updated=Date.now();saveV(true);
}
const tname=id=>{try{const it=(typeof librePool==='function'&&librePool()[id])||tournamentItem(id);return it?it.n:id}catch(e){return id}};
const rows=m=>Object.keys(m).map(id=>({id,equipo:tname(id),votos:m[id].votes,usuariosUnicos:m[id].u.length})).sort((a,b)=>b.votos-a.votos||a.equipo.localeCompare(b.equipo));
const sum=m=>Object.values(m).reduce((a,r)=>a+r.votes,0);
function votesObj(){
 const ru=new Set();Object.values(VS.round).forEach(r=>r.u.forEach(x=>ru.add(x)));
 return{formato:'cluss-torneo-libre-votos',version:1,exportadoEn:iso(Date.now()),creadoEn:iso(VS.created),actualizadoEn:iso(VS.updated),
  privacidad:'Sin nombres de usuario. Los usuarios únicos se cuentan con huellas con sal que no se exportan.',
  resumen:{votosTotales:sum(VS.total),usuariosUnicos:VS.all.length,rondasRegistradas:VS.rounds.length},
  equipos:rows(VS.total),
  rondaActual:{votos:sum(VS.round),usuariosUnicos:ru.size,equipos:rows(VS.round)},
  rondas:VS.rounds.map(r=>({fecha:iso(r.t),duelo:r.duel.map(tname),usuariosUnicos:r.uniqueUsers,
   votos:Object.keys(r.votes).map(id=>({id,equipo:tname(id),votos:r.votes[id].votes,usuariosUnicos:r.votes[id].uniqueUsers}))}))};
}
/* enganche: al sortear el duelo siguiente se cierra la ronda de votos */
const _ld=libreDuel;
libreDuel=function(){const d=_ld.apply(this,arguments);try{commitRound(d)}catch(e){console.error(e)}return d};
/* tras recargar la pagina, la ronda de votos en curso sigue (menos los equipos que ya juegan) */
try{if(!Object.keys(libreVotes).length){const playing=new Set((typeof DUELO!=='undefined'?DUELO:[]).map(libreCanon));
 Object.keys(VS.round).forEach(id=>{if(!playing.has(id)&&VS.round[id].votes>0)libreVotes[id]=VS.round[id].votes})}}catch(e){}
window.libreArchive={vote,commitRound,data:votesObj};

/* ---------- ARCHIVO DE TEXTOS DEL CHAT (sin autor) ---------- */
/* BACKEND: los textos del chat YA NO se guardan en el cliente: cada texto se agrega al flujo chat-texts (POST /api/log/chat-texts). El cliente solo lleva un contador; el valor inicial sale de la clave de solo lectura cluss.chatArchive = {v,created,updated,trimmed,count} que el servidor puede incluir en /api/state.js. */
let CA=ld(K_C);
if(!CA||typeof CA!=='object'||CA.v!==1)CA={v:1,created:Date.now(),updated:Date.now(),trimmed:0,count:0};
CA=Object.assign({},CA,{count:+CA.count||0}); /* copia: el cliente nunca reenvia este documento */
const saveC=now=>{if(now)SRV.flush(true)}; /* solo vacia la cola de envio al servidor */
function addChat(text){const t=String(text==null?'':text).replace(/\s+/g,' ').trim().slice(0,MAX_TXT);if(!t)return;SRV.log('chat-texts',[Date.now(),t]);CA.count++;CA.updated=Date.now()}
const SRVCHAT_JSON='/api/log/chat-texts.json',SRVCHAT_TXT='/api/log/chat-texts.txt'; /* BACKEND: descargas del archivo completo del chat, con Content-Disposition: attachment */
const chatJSON=()=>fetch(SRVCHAT_JSON).then(r=>r.text());
const chatTXT=()=>fetch(SRVCHAT_TXT).then(r=>r.text());
function clearChat(){SRV.clearLog('chat-texts');CA.count=0;CA.trimmed=0;CA.created=CA.updated=Date.now()} /* BACKEND: DELETE /api/log/chat-texts */ /* SOLO la llama el boton confirmado */
const _hle=handleLiveEntry;
handleLiveEntry=function(e){try{if(e&&!e.bot&&e.type==='chat')addChat(e.content)}catch(x){console.error(x)}return _hle.apply(this,arguments)};
addEventListener('pagehide',()=>{saveV(true);saveC(true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveV(true);saveC(true)}});

/* ---------- DESCARGA ---------- */
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
const dlVotes=()=>dl('torneo-libre-votos-'+stamp()+'.json',JSON.stringify(votesObj(),null,1),'application/json');
const dlSrv=(url,name)=>{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()};
const dlChatJSON=()=>dlSrv(SRVCHAT_JSON,'chat-textos-'+stamp()+'.json');
const dlChatTXT=()=>dlSrv(SRVCHAT_TXT,'chat-textos-'+stamp()+'.txt');

/* ---------- PANEL ---------- */
const app=document.getElementById('app')||document.body,p=document.createElement('div');
p.id='arch';p.hidden=true;p.setAttribute('role','dialog');p.setAttribute('aria-label','Archivos de votos y chat');
p.innerHTML='<header><b>🗂️ Archivos</b><button type="button" data-a="close" aria-label="Cerrar">✕</button></header>'
+'<section><h3>🗳️ Votos del Torneo Libre</h3><div id="arV"></div><ul id="arVl"></ul><div class="mut">Solo conteos: sin nombres de usuario.</div>'
+'<button type="button" data-a="votes">⬇ Votos (JSON)</button></section>'
+'<section><h3>💬 Textos del chat</h3><div id="arC"></div><div class="mut">Solo el texto y la hora: sin autor. Descargar no borra nada.</div>'
+'<button type="button" data-a="cjson">⬇ Chat (JSON)</button><button type="button" data-a="ctxt">⬇ Chat (TXT)</button></section>'
+'<section><h3>🗑️ Vaciar archivo del chat</h3><div id="arK"><button type="button" class="warn" data-a="ask">Vaciar archivo del chat…</button></div><div id="arM" class="mut"></div></section>';
app.appendChild(p);
const $a=s=>p.querySelector(s);let askT=0;
function stopAsk(){clearTimeout(askT);askT=0;$a('#arK').innerHTML='<button type="button" class="warn" data-a="ask">Vaciar archivo del chat…</button>'}
function paint(){
 if(p.hidden)return;
 const r=rows(VS.round).slice(0,5);
 $a('#arV').textContent='Votos: '+sum(VS.total)+' · Usuarios únicos: '+VS.all.length+' · Rondas: '+VS.rounds.length;
 $a('#arVl').innerHTML=r.length?r.map(x=>'<li>'+x.equipo.replace(/[<&]/g,'')+': '+x.votos+' voto'+(x.votos===1?'':'s')+' ('+x.usuariosUnicos+' usuario'+(x.usuariosUnicos===1?'':'s')+')</li>').join(''):'<li class="mut">Sin votos en la ronda actual</li>';
 $a('#arC').textContent='Textos archivados (en el servidor): '+CA.count;
}
function open(){p.hidden=false;stopAsk();$a('#arM').textContent='';paint()}
function close(){p.hidden=true;stopAsk()}
p.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,m=$a('#arM');
 if(a==='close')close();
 else if(a==='votes'){dlVotes();m.textContent='Votos descargados (el archivo se conserva).'}
 else if(a==='cjson'){dlChatJSON();m.textContent='Chat (JSON) descargado (el archivo se conserva).'}
 else if(a==='ctxt'){dlChatTXT();m.textContent='Chat (TXT) descargado (el archivo se conserva).'}
 else if(a==='ask'){$a('#arK').innerHTML='<div>¿Vaciar '+CA.count+' textos? No se puede deshacer.</div><button type="button" class="warn" data-a="yes">Sí, vaciar</button><button type="button" data-a="no">Cancelar</button>';askT=setTimeout(stopAsk,8000)}
 else if(a==='no')stopAsk();
 else if(a==='yes'){clearChat();stopAsk();m.textContent='Archivo del chat vaciado.'}
 paint()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!p.hidden)close()});
setInterval(paint,1000);
const bs=document.getElementById('bStat');
if(bs){const b=document.createElement('button');b.className='sm';b.id='bArch';b.type='button';b.textContent='🗂️';b.setAttribute('aria-label','Archivos: votos del Torneo Libre y textos del chat');b.title='Archivos: votos y chat';b.addEventListener('click',open);bs.parentNode.insertBefore(b,bs)}
window.archivoCluss={open,close,votes:{vote,commitRound,obj:votesObj,json:()=>JSON.stringify(votesObj(),null,1),download:dlVotes},chat:{add:addChat,count:()=>CA.count,json:chatJSON,txt:chatTXT,clear:clearChat,downloadJSON:dlChatJSON,downloadTXT:dlChatTXT}};
})();
</script>

<!-- ===== GAMIFICACION Y EFECTOS v2 (capa final, solo reacciona a eventos REALES; el bot nunca; no pide ni promete nada). Incluye: fanfarria de NIVEL, HINCHADA (ritmo de eventos en 8 s con 3 escalones), primer regalo de la ronda, lluvia de monedas con sacudida por regalo, y lineas de velocidad en el carril con TURBO. Para quitar: borrar este bloque. ===== -->
<style id="gami-v2">
.lane.turbo .sv:after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:9px;
 background:repeating-linear-gradient(180deg,rgba(255,235,120,.75) 0 24px,transparent 24px 64px);background-size:100% 64px;
 -webkit-mask-image:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 19px);mask-image:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 19px);
 opacity:.55;animation:gmSpd .28s linear infinite}
@keyframes gmSpd{to{background-position:0 64px}}
#nivelBadge{position:relative}
#nivelBadge.up:after{content:"🆙";position:absolute;right:-8px;top:-12px;font-size:16px;animation:gmUp 1s ease-out forwards}
@keyframes gmUp{0%{opacity:0;transform:translateY(6px) scale(.4)}25%{opacity:1;transform:translateY(-2px) scale(1.3)}100%{opacity:0;transform:translateY(-18px) scale(1)}}
#gmHot{position:absolute;left:50%;top:44px;transform:translateX(-50%);z-index:45;display:none;padding:3px 12px;border-radius:12px;border:2px solid #ff8a1f;background:rgba(20,8,2,.88);color:#ffd34d;font:900 12px/1.1 Inter,sans-serif;letter-spacing:.4px;text-shadow:0 1px 2px #000;pointer-events:none;white-space:nowrap}
#gmHot.on{display:block;animation:gmHot 1.2s ease-in-out infinite alternate}
@keyframes gmHot{from{box-shadow:0 0 6px 1px rgba(255,138,31,.6)}to{box-shadow:0 0 16px 5px rgba(255,138,31,.95)}}
@media (prefers-reduced-motion:reduce){.lane.turbo .sv:after,#nivelBadge.up:after,#gmHot.on{animation:none}}
</style>
<script>
(function(){
const F=window.fx;if(!F||!F.cannon||!F.FA)return;
const app=document.getElementById('app'),board=document.querySelector('.board'),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const hot=document.createElement('div');hot.id='gmHot';hot.setAttribute('aria-hidden','true');app.appendChild(hot);
const shake=()=>{if(!board||RM)return;board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake')};
let lastLv=0;
/* 1) NIVEL: fanfarria al subir (el cartel #nivelBadge lo anima levelUp) */
const nb=document.getElementById('nivelBadge');
if(nb&&window.MutationObserver)new MutationObserver(()=>{
 const now=performance.now();if(!nb.classList.contains('up')||now-lastLv<400)return;lastLv=now;
 const n=(nb.textContent.match(/\d+/)||['?'])[0];
 F.banner('🆙 NIVEL '+n,'#ffd34d');F.flash('#ffe9a8');
 F.cannon(0,746,-62,22,700,16);F.cannon(416,746,-118,22,700,16);F.FA.p('star');F.FA.p('mile',.15);
 if(+n%5===0){F.firework(208,230);setTimeout(()=>F.firework(110,300,'#ffd34d'),350);setTimeout(()=>F.firework(310,300,'#5ec3f2'),700);F.FA.p('champ')}
}).observe(nb,{attributes:true,attributeFilter:['class']});
/* 2) HINCHADA: eventos reales de los ultimos 8 s; 3 escalones, cada uno una vez por ronda con 20 s de enfriamiento */
const ev=[],TIERS=[[10,'🔥 HINCHADA CALIENTE','#ff8a1f'],[25,'⚡ HINCHADA EN LLAMAS','#ffd34d'],[50,'🌋 HINCHADA ÉPICA','#e11d48']];
let tierDone=-1,tierAt=0,firstGift=false,hotT=0;
function pulse(){const now=Date.now();while(ev.length&&now-ev[0]>8000)ev.shift();return ev.length}
function onTier(i){
 const [,txt,col]=TIERS[i];F.banner(txt,col);F.FA.p(i===2?'champ':i===1?'comeback':'mile');
 F.burst(208,330,col,34,240);F.ring(208,330,col);
 if(i>=1){F.cannon(0,746,-62,18,680,16);F.cannon(416,746,-118,18,680,16)}
 if(i===2){F.flash('#ffb347');F.firework(208,200);shake()}
 hot.textContent=txt;hot.style.borderColor=col;hot.classList.add('on');clearTimeout(hotT);hotT=setTimeout(()=>hot.classList.remove('on'),6000);
}
/* 3) REGALOS reales: lluvia de monedas + sacudida; el primero de la ronda tiene cartel propio */
const _h=handleLiveEntry;
handleLiveEntry=function(e){
 const r=_h.apply(this,arguments);
 try{if(e&&!e.bot&&['chat','like','gift','follow','share'].includes(e.type)){
  const w=e.type==='like'?Math.min(5,Math.max(1,+e.activityCount||1)):e.type==='gift'?5:1;
  for(let k=0;k<w;k++)ev.push(Date.now());
  const n=pulse(),now=performance.now();
  if(now-tierAt>20000)for(let i=TIERS.length-1;i>tierDone;i--)if(n>=TIERS[i][0]){tierDone=i;tierAt=now;onTier(i);break}
  if(e.type==='gift'&&!(typeof over!=='undefined'&&over)){
   const q=Math.max(1,+e.activityCount||1);
   F.rain(Math.min(40,10+q*4),['#ffd34d','#ffe9a8','#ff8a1f'],900);F.FA.p('heart');shake();
   if(!firstGift){firstGift=true;F.banner('🎁 ¡PRIMER REGALO!','#e11d48');F.cannon(208,746,-90,20,600,30)}
  }}}catch(x){console.error(x)}
 return r};
/* cada ronda nueva reinicia escalones y primer regalo */
const _r=reset;
reset=function(){tierDone=-1;tierAt=0;firstGift=false;ev.length=0;hot.classList.remove('on');return _r.apply(this,arguments)};
})();
</script>

<!-- ===== CORAZON DEL LIMITE DE TAPS: mas grande y LATIENDO (el ritmo se acelera a medida que el contador se llena). Para quitar: borrar este bloque. ===== -->
<style id="corazon-late">
.hb{height:24px!important}
.hb .hi{left:-4px!important;margin-top:-13px!important;font-size:26px!important;line-height:26px!important;z-index:4;transform-origin:50% 55%;
 filter:drop-shadow(0 0 6px rgba(255,45,85,.9)) drop-shadow(0 2px 2px rgba(0,0,0,.8));
 animation:gmHeart 8s linear infinite!important}
.hb.bump .hi,.hb.full .hi{animation:gmHeart 8s linear infinite!important}
.hb i{margin-left:18px!important}
.hb em{left:26px!important}
/* sincronizado con el regalo (#regalos .ic usa rgWob 1.6 s alternate: escala 1 -> 1.15). Aqui es al reves: cuando el regalo SUBE, el corazon BAJA */
/* TURNOS (ciclo de 8 s): primero SUBE el regalo (rapido), espera arriba y BAJA despacio; recien cuando termino de bajar, SUBE el corazon, espera y baja despacio. Nunca estan los dos arriba a la vez. */
@keyframes gmGift{0%{transform:scale(1);animation-timing-function:ease-out}8%{transform:scale(1.3);animation-timing-function:linear}30%{transform:scale(1.3);animation-timing-function:ease-in-out}50%,100%{transform:scale(1)}}
@keyframes gmHeart{0%,50%{transform:scale(.8);animation-timing-function:ease-out}58%{transform:scale(1.3);animation-timing-function:linear}80%{transform:scale(1.3);animation-timing-function:ease-in-out}100%{transform:scale(.8)}}
#regalos .ic,#regalos .gc:nth-child(2) .ic,#regalos .gc:nth-child(3) .ic{animation:gmGift 8s linear infinite!important;animation-delay:0s!important;transform-origin:50% 60%}
.hb.bump i{box-shadow:0 0 8px 2px rgba(255,90,130,.95)}
@media (prefers-reduced-motion:reduce){.hb .hi,.hb.bump .hi,.hb.full .hi,#regalos .ic{animation:none!important}}
</style>
<script>
(function(){
/* ritmo del latido: 2.0 s con el contador vacio -> 1.3 s casi lleno (el limite y el valor salen de aria-valuemax / aria-valuenow) */
function ritmo(){document.querySelectorAll('.hb').forEach(h=>{
 const max=+h.getAttribute('aria-valuemax')||1,now=+h.getAttribute('aria-valuenow')||0,r=Math.max(0,Math.min(1,now/max));
 const d=(3.0-0.8*r).toFixed(2)+'s';if(h.style.getPropertyValue('--bd')!==d)h.style.setProperty('--bd',d)})}
setInterval(ritmo,300);ritmo();
/* SINCRONIA: corazon y regalo comparten reloj (startTime 0) y el mismo ciclo de 8 s, por turnos */
function sincro(){try{document.querySelectorAll('.hb .hi,#regalos .ic').forEach(el=>el.getAnimations().forEach(a=>{
 if(a.animationName==='gmHeart'||a.animationName==='gmGift'){if(a.startTime!==0)a.startTime=0}}))}catch(e){}}
sincro();setTimeout(sincro,800);addEventListener('load',sincro);setInterval(sincro,2000);
})();
</script>
</body>
